services:
  qdrant:
    # Pinned versions: set them in .env (see .env.example).
    # Pin to the versions you run TODAY - downgrading Qdrant or Grafana
    # can fail to read data written by a newer version.
    image: qdrant/qdrant:${QDRANT_VERSION:?Set QDRANT_VERSION in .env}
    container_name: llmops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llmops-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      GOOGLE_CREDENTIALS_FILE: /app/vertex-credentials.json
      GOOGLE_APPLICATION_CREDENTIALS: /app/vertex-credentials.json
    volumes:
      - ./data:/app/data
      - ./vertex-credentials.json:/app/vertex-credentials.json:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl, so use Python itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: llmops-ui
    ports:
      - "8501:8501"
    environment:
      FASTAPI_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:?Set PROMETHEUS_VERSION in .env}
    container_name: llmops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:?Set GRAFANA_VERSION in .env}
    container_name: llmops-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  # Same volume name as before, so your existing vectors are kept.
  # Without "external: true", Compose creates it automatically on a
  # fresh machine instead of failing.
  qdrant_storage:
    name: qdrant_storage
  prometheus_data:
  grafana_data: